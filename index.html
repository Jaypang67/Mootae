<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>นิทรรศการของเรา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500;700&family=Sriracha&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0708;
    --ink:#f7eef0;
    --muted:#c9a9b2;
    --pink:#f4a6b8;
    --pink-hot:#ea4f94;
    --cw:62vw;          /* card width on phones */
    --pile:50vw;        /* distance of side piles from center on phones */
  }
  @media (min-width:768px){
    :root{ --cw:min(30vw,320px); --pile:min(36vw,370px); }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Prompt',sans-serif;overflow:hidden;height:100%}
  body{
    background:
      radial-gradient(ellipse at 50% 0%, rgba(234,79,148,.18), transparent 55%),
      radial-gradient(ellipse at 50% 120%, rgba(244,166,184,.08), transparent 50%),
      var(--bg);
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
  }

  /* ---------- Gate: museum admission ticket ---------- */
  #gate{
    position:relative;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:24px 16px;text-align:center;
    transition:transform .9s ease-in, opacity .9s ease-in, filter .9s ease-in;
  }
  #gate.leaving{transform:scale(1.15);opacity:0;filter:blur(8px)}
  #gate > *:not(.ambient):not(.fx-layer){position:relative;z-index:1}
  .ambient{
    position:absolute;inset:-20%;pointer-events:none;filter:blur(30px);
    background:
      radial-gradient(circle at 30% 30%, rgba(234,79,148,.26), transparent 40%),
      radial-gradient(circle at 72% 70%, rgba(120,10,30,.38), transparent 45%);
    animation:drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift{from{transform:translate3d(-3%,-2%,0)}to{transform:translate3d(3%,2%,0) scale(1.06)}}
  .fx-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .heart{position:absolute;bottom:-40px;color:var(--pink-hot);opacity:.5;animation:rise linear infinite;text-shadow:0 0 10px rgba(234,79,148,.7)}
  @keyframes rise{from{transform:translateY(0) rotate(0deg)}to{transform:translateY(-115vh) rotate(25deg)}}
  .spark{position:absolute;width:7px;height:7px;background:#fff;opacity:0;box-shadow:0 0 8px var(--pink);animation:twinkle ease-in-out infinite;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.9;transform:scale(1)}}

  .ticket-wrap{width:min(88vw,400px)}
  .ticket-wrap.shake{animation:shake .45s}
  .ticket{
    position:relative;overflow:hidden;border-radius:18px;
    background:linear-gradient(160deg,#2c0c15 0%,#150709 55%,#1d0a10 100%);
    border:1.5px solid var(--pink-hot);
    box-shadow:0 0 22px rgba(234,79,148,.55), 0 0 70px -12px rgba(234,79,148,.45), 0 30px 60px -20px #000, inset 0 0 26px rgba(234,79,148,.18);
    animation:ticketIn 1.1s cubic-bezier(.2,.9,.25,1) both;
    transition:box-shadow .5s ease;
  }
  .ticket::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(135deg, rgba(244,166,184,.035) 0 2px, transparent 2px 10px);
  }
  .ticket.admitted{box-shadow:0 0 44px rgba(234,79,148,.95), 0 0 90px -10px rgba(234,79,148,.7), 0 30px 60px -20px #000}
  @keyframes ticketIn{from{opacity:0;transform:translateY(-40px) rotate(-6deg) scale(.92)}to{opacity:1;transform:none}}
  .tk-main{position:relative;padding:30px 28px 24px}
  .tk-kicker{font-size:11px;letter-spacing:.32em;color:var(--pink);text-transform:uppercase}
  .tk-title{font-family:'Sriracha',cursive;font-weight:400;font-size:clamp(32px,8vw,42px);line-height:1.1;margin:14px 0 6px;color:#fff;text-shadow:0 0 18px rgba(234,79,148,.55)}
  .tk-name{font-family:'Sriracha',cursive;font-size:30px;color:var(--pink);line-height:1.2}
  .tk-tag{margin-top:12px;font-size:10.5px;letter-spacing:.3em;color:var(--muted)}
  .tk-stamp{
    position:absolute;left:50%;top:50%;opacity:0;pointer-events:none;
    transform:translate(-50%,-50%) rotate(-12deg) scale(2);
    border:3px solid var(--pink-hot);border-radius:6px;padding:6px 14px;color:var(--pink-hot);
    font-size:18px;font-weight:700;letter-spacing:.2em;text-shadow:0 0 12px rgba(234,79,148,.7);
  }
  .ticket.admitted .tk-stamp{animation:stampIn .6s cubic-bezier(.2,.9,.3,1.2) .1s forwards}
  @keyframes stampIn{to{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}
  .tk-perf{position:relative;height:0;border-top:1.5px dashed rgba(244,166,184,.5);margin:0 22px}
  .notch{position:absolute;top:-13px;width:26px;height:26px;border-radius:50%;background:#0d0609;border:1.5px solid var(--pink-hot);box-shadow:0 0 10px rgba(234,79,148,.4)}
  .notch.l{left:-35px}
  .notch.r{right:-35px}
  .tk-stub{position:relative;padding:20px 24px 24px}
  .tk-label{font-size:10.5px;letter-spacing:.3em;color:var(--pink)}
  .slots{display:flex;justify-content:center;gap:10px;margin-top:14px}
  .slot{width:36px;height:46px;border-bottom:2px solid var(--pink-hot);display:flex;align-items:center;justify-content:center;transition:border-color .3s}
  .slot.on{border-color:var(--pink)}
  .slot::after{
    content:"";width:11px;height:11px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink-hot);
    transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1);
  }
  .slot.on::after{transform:scale(1)}

  .hint{min-height:20px;font-size:13px;color:var(--pink)}
  .keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:min(86vw,300px)}
  .key{
    height:56px;border-radius:14px;border:1px solid rgba(244,166,184,.35);
    background:radial-gradient(circle at 50% 30%,#2a0d15,#120608);color:#fff;
    font-family:inherit;font-size:22px;font-weight:300;cursor:pointer;
    display:flex;align-items:center;justify-content:center;user-select:none;-webkit-tap-highlight-color:transparent;
    transition:transform .12s, box-shadow .2s, border-color .2s;
  }
  .key:hover{border-color:var(--pink-hot);box-shadow:0 0 16px rgba(234,79,148,.4)}
  .key:active{transform:scale(.92);box-shadow:0 0 22px rgba(234,79,148,.6)}
  .key.fn{font-size:15px;letter-spacing:.15em;color:var(--pink)}
  .key svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .key:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);opacity:0}
  .shake{animation:shake .45s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}
    40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}
  }

  /* ---------- Hall ---------- */
  #hall{
    display:none;height:100vh;height:100dvh;flex-direction:column;align-items:center;
    padding-top:max(18px, env(safe-area-inset-top, 0px));
    padding-bottom:max(18px, env(safe-area-inset-bottom, 0px));
  }
  #hall.open{display:flex}
  .hall-head{text-align:center;flex:0 0 auto}
  .hall-head h1{font-family:'Sriracha',cursive;font-weight:400;font-size:clamp(30px,6vw,44px);line-height:1.1}
  .hall-head p{color:var(--muted);font-weight:300;margin-top:4px;font-size:13px}

  .stage{
    position:relative;flex:1 1 auto;width:100%;min-height:0;
    perspective:1200px;overflow:hidden;touch-action:pan-y;
  }
  .slide{
    position:absolute;left:50%;top:50%;width:var(--cw);
    transform-style:preserve-3d;
    transition:transform .9s cubic-bezier(.2,.8,.2,1), opacity .6s ease, filter .6s ease;
  }

  /* neon card */
  .card{
    position:relative;padding:12px 12px 16px;border-radius:6px;
    background:linear-gradient(170deg,#2b0d17 0%,#150809 70%);
    border:1.5px solid var(--pink-hot);
    box-shadow:0 0 18px rgba(234,79,148,.55), 0 0 40px -10px rgba(234,79,148,.5), inset 0 0 14px rgba(234,79,148,.25);
  }
  .label{font-size:11px;letter-spacing:.2em;color:var(--pink);text-transform:uppercase;margin:2px 2px 10px}
  .frame{
    position:relative;width:100%;aspect-ratio:4/5;background:#000;overflow:hidden;
    border:1px solid rgba(244,166,184,.45);
  }
  .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .frame.missing{display:flex;align-items:center;justify-content:center;padding:16px}
  .frame.missing::after{content:"ใส่รูป " attr(data-src);color:var(--muted);font-size:13px;text-align:center}
  .card .caption{
    font-size:15px;line-height:1.8;color:#f6e9ed;font-weight:300;letter-spacing:.01em;
    margin:16px 4px 2px;text-align:left;text-wrap:pretty;
  }
  /* closing envelope */
  .closing-slide{width:min(78vw,300px)}
  .env{position:relative;width:100%;height:170px;cursor:pointer;perspective:800px}
  .env-back{position:absolute;inset:0;border-radius:6px;background:#2b0d17;border:1.5px solid var(--pink-hot);box-shadow:0 0 18px rgba(234,79,148,.5);z-index:1}
  .letter{
    position:absolute;left:14px;right:14px;bottom:10px;height:210px;z-index:2;overflow:hidden;
    background:#f7efe9;color:#2a1417;padding:18px 18px;border-radius:4px;box-shadow:0 6px 16px rgba(0,0,0,.4);
    opacity:0;transform:translateY(0) scale(.85);
    transition:transform .9s cubic-bezier(.2,1.25,.4,1) .75s, opacity .4s ease .75s;
  }
  .env.open .letter{opacity:1;transform:translateY(-90px) scale(1)}
  .letter h3{font-family:'Sriracha',cursive;font-weight:400;font-size:24px;color:#a3245c;line-height:1.25;margin-bottom:10px}
  .letter-body{font-size:13px;line-height:1.8;white-space:pre-line;color:#3b2a2d;font-weight:300}
  .letter-sign{margin-top:10px;text-align:right;font-family:'Sriracha',cursive;font-size:19px;color:#a3245c}
  .env-front{
    position:absolute;left:0;right:0;bottom:0;height:100px;z-index:3;border-radius:0 0 6px 6px;
    background:linear-gradient(180deg,#4a1a28,#2b0d17);
    clip-path:polygon(0 0,50% 45%,100% 0,100% 100%,0 100%);
  }
  .env-flap{
    position:absolute;left:0;right:0;top:0;height:90px;z-index:4;
    background:linear-gradient(180deg,#5a2233,#3a1520);
    clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top center;
    transition:transform .8s cubic-bezier(.4,0,.2,1);
  }
  .env.open .env-flap{transform:rotateX(180deg);z-index:0;transition-delay:0s}
  .seal{
    position:absolute;left:50%;top:60px;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;
    background:radial-gradient(circle,var(--pink-hot),#8f1d50);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 14px rgba(234,79,148,.6);transition:opacity .4s;
  }
  .env.open .seal{opacity:0}
  .seal svg{width:22px;height:22px;fill:#fff}

  /* ---------- Bottom controls ---------- */
  .controls{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:6px}
  .bar{width:min(60vw,300px);height:2px;background:rgba(244,166,184,.2);position:relative;overflow:hidden}
  .bar::after{
    content:"";position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);
    background:linear-gradient(90deg,var(--pink-hot),var(--pink));
    box-shadow:0 0 8px var(--pink-hot);transition:width .6s ease;
  }
  .next{
    width:60px;height:60px;border-radius:50%;cursor:pointer;
    border:1.5px solid var(--pink-hot);background:rgba(234,79,148,.12);color:var(--pink);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 18px rgba(234,79,148,.45);transition:transform .2s, background .2s;
  }
  .next:hover{background:rgba(234,79,148,.28)}
  .next:active{transform:scale(.94)}
  .next:focus-visible{outline:2px solid var(--pink);outline-offset:4px}
  .next svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* back to login */
  .back-btn{
    position:fixed;top:max(14px, env(safe-area-inset-top, 0px));left:max(14px, env(safe-area-inset-left, 0px));z-index:30;
    width:46px;height:46px;border-radius:50%;cursor:pointer;
    border:1.5px solid var(--pink-hot);background:rgba(11,7,8,.75);color:var(--pink);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 14px rgba(234,79,148,.4);transition:background .2s, transform .2s;
  }
  .back-btn:hover{background:rgba(234,79,148,.28)}
  .back-btn:active{transform:scale(.94)}
  .back-btn:focus-visible{outline:2px solid var(--pink);outline-offset:3px}
  .back-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  /* warp + full-screen letter */
  .env.warp{transform:scale(2.6);opacity:0;transition:transform .9s cubic-bezier(.5,0,.8,.3), opacity .5s ease .45s}
  .warp-fx{
    position:fixed;inset:0;z-index:150;pointer-events:none;opacity:0;
    background:
      radial-gradient(circle at 50% 50%, #fff 0%, rgba(244,166,184,.9) 12%, transparent 45%),
      repeating-radial-gradient(circle at 50% 50%, rgba(244,166,184,.8) 0 2px, transparent 2px 24px);
  }
  .warp-fx.run{animation:warp 1s ease-in forwards}
  @keyframes warp{
    0%{opacity:0;transform:scale(.15)}
    35%{opacity:1}
    100%{opacity:1;transform:scale(2.6)}
  }
  .letter-full{
    position:fixed;inset:0;z-index:200;background:rgba(11,7,8,.92);color:#2a1417;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    opacity:0;pointer-events:none;transition:opacity .6s ease;
  }
  .letter-full.show{opacity:1;pointer-events:auto}
  .lf-inner{
    max-width:640px;margin:64px auto 90px;padding:44px 40px 52px;border-radius:4px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.018) 0 1px, transparent 1px 3px),
      linear-gradient(160deg,#f7efe9,#efe6dc);
    box-shadow:0 30px 60px -18px rgba(0,0,0,.9), 0 0 0 1px rgba(244,166,184,.25), 0 0 30px -8px rgba(234,79,148,.35);
  }
  .lf-deco{text-align:center;font-size:20px;letter-spacing:.5em;color:#c2185b;margin-bottom:10px}
  .lf-inner h3{font-family:'Sriracha',cursive;font-weight:400;font-size:clamp(28px,6vw,40px);color:#a3245c;line-height:1.25;margin-bottom:26px;text-align:center;text-wrap:balance}
  .lf-body{font-family:'Prompt',sans-serif;font-size:17px;line-height:2.05;white-space:pre-wrap;color:#2f2023;font-weight:300;word-break:break-word;text-wrap:pretty;padding-bottom:4px}
  .lf-sign{margin-top:32px;text-align:right;font-family:'Sriracha',cursive;font-size:24px;color:#a3245c}
  .lf-close{
    position:fixed;top:max(14px, env(safe-area-inset-top, 0px));right:14px;z-index:210;
    width:46px;height:46px;border-radius:50%;border:1.5px solid #a3245c;background:rgba(247,239,233,.92);
    color:#a3245c;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .lf-close svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

  @media (prefers-reduced-motion:reduce){
    .slide,.ticket,.ambient,.heart,.spark,.warp-fx.run{animation:none!important;transition:none!important}
    .fx-layer{display:none}
  }
</style>
</head>
<body>

<!-- ============ GATE ============ -->
<section id="gate">
  <div class="ambient" aria-hidden="true"></div>
  <div class="fx-layer" id="fxLayer" aria-hidden="true"></div>

  <div class="ticket-wrap" id="ticketWrap">
    <div class="ticket" id="ticket">
      <div class="tk-main">
        <div class="tk-kicker">🎟️ MUSEUM ADMISSION</div>
        <h1 class="tk-title">Happy 1 Month Anniversary</h1>
        <div class="tk-name">Mootae ♡</div>
        <div class="tk-tag">SPECIAL ENTRY · 01 MONTH</div>
        <div class="tk-stamp" aria-hidden="true">ADMITTED</div>
      </div>
      <div class="tk-perf" aria-hidden="true"><span class="notch l"></span><span class="notch r"></span></div>
      <div class="tk-stub">
        <div class="tk-label">ENTER PIN</div>
        <div class="slots" id="slots" aria-label="รหัสที่กรอก"></div>
      </div>
    </div>
  </div>

  <div class="hint" id="hint" aria-live="polite"></div>
  <div class="keypad" id="keypad" role="group" aria-label="แป้นตัวเลข"></div>
  <input id="code" class="sr-only" type="password" inputmode="none" autocomplete="off" maxlength="12" tabindex="-1" aria-hidden="true">
</section>

<!-- ============ HALL ============ -->
<main id="hall">
  <button class="back-btn" id="backBtn" aria-label="กลับไปหน้าเข้าสู่ระบบ">
    <svg viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg>
  </button>
  <header class="hall-head">
    <h1 id="hallTitle"></h1>
    <p id="hallSub"></p>
  </header>

  <div class="stage" id="stage"></div>

  <div class="controls">
    <div class="bar" id="bar"></div>
    <button class="next" id="nextBtn" aria-label="ถัดไป">
      <svg viewBox="0 0 24 24" id="nextIcon"><polyline points="9 5 16 12 9 19"/></svg>
    </button>
  </div>
</main>

<script>
/* ================================================================
   แก้ตรงนี้ได้เลย
   - passcode: รหัสเข้าชม
   - photos: วางรูปในโฟลเดอร์ "photos" ข้าง ๆ ไฟล์นี้ แล้วใส่ชื่อไฟล์ตรง src
   ================================================================ */
const CONFIG = {
  passcode: "121069",
  hint: "ลองนึกถึงวันที่เราเริ่มต้นดูสิ",
  hallTitle: "นิทรรศการของเรา",
  hallSub: "หนึ่งเดือนแห่งความทรงจำ",
  exhibits: [
    { src: "photos/1.jpg", caption: "มื้อแรกที่กินข้าวด้วยกันนอกบ้าน" },
    { src: "photos/2.jpg", caption: "เธอตามใจพามากินของที่อยากกิน" },
    { src: "photos/3.jpg", caption: "เธออยากกินหมูกระทะเค้าก็พาเธอไป" },
    { src: "photos/4.jpg", caption: "แอบถ่ายตอนทีเผลอน่ารักๆ" },
    { src: "photos/5.jpg", caption: "ถ่ายโฟโต้บูทด้วยกันครั้งแรก" },
    { src: "photos/6.jpg", caption: "รูปหลุดๆที่เราถ่ายด้วยกัน" }
  ],
  closingBig: "Happy Month Anniversary For My Love 💗",
  letterBody: "เดินทางมาด้วยกัน 1 เดือนแล้วนะหมูเต๊ะ เค้าขอบคุณนะที่ยังรักเค้าอยุ่ ถึงเค้าจะงอแงไปบ้าง ทำให้เป็นห่วง เอาแต่ใจ แต่เค้าไม่อยากให้เธอรักเค้าน้อยลงนะคะ เธอเป็นความสุขของเค้าเลยนะตั้งแต่เราคุยกันมา ขอบคุณนะที่เลือกเค้า จากนี้เค้าสัญญาจะทำให้เธอมีความสุขมากขึ้นในทุกๆวัน เรื่องราวของเราจะเดินกันต่อไปเรื่อยๆ ถึงเค้าจะปากแข็งไปบ้าง แต่เค้ารักเธอนะรักเธอมาก ไม่รู้จะหาคำไหนมาบอกมากกว่ารัก ขอให้เราทั้งคู่เดินทางเก็บเรื่องราวแบบนี้ไปอีกนานๆนะ ตลอดไป สุดท้ายที่ถ้าเธออ่านจบแล้ว เค้าก็อยากจะบอกแค่ว่า กินข้าวเยอะๆ อย่านอนดึก ใช้ชีวิตให้มีความสุข เรื่องอะไรที่คิดมากเค้าคนนี้จะรับฟังเธออยุ่ข้างๆเสมอ เวลาฝนตกก็อย่าฝืนไปนะเค้าไม่อยากเห็นเธอป่วย สระผมก็เป่าให้แห้งเสมอ ไปไหนมาไหนก็ต้องระวังตัวเอง ถึงวันไหนที่เค้าไม่มีเวลาให้เธอ เค้าก็จะหาเวลามาคุยกับเธอให้ได้ สุดท้ายนี้ไม่ว่าเรื่องอะไรเค้าก็อยากให้เธอหมดเลย พรข้อไหนที่ดีที่สุด เค้าให้เธอหมดเลย เค้ารักเธอนะหมูเต๊ะ จาก เจ",
  closingSmall: ""
};

const $ = s => document.querySelector(s);
$('#hallTitle').textContent = CONFIG.hallTitle;
$('#hallSub').textContent = CONFIG.hallSub;

/* ---------- Build pieces: photo cards, then closing card ---------- */
const stage = $('#stage');
const slides = [];

CONFIG.exhibits.forEach((ex, i) => {
  const el = document.createElement('section');
  el.className = 'slide';

  const card = document.createElement('div');
  card.className = 'card';

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = `No. ${i + 1}`;

  const frame = document.createElement('div');
  frame.className = 'frame';
  frame.dataset.src = ex.src;
  const img = document.createElement('img');
  img.alt = ex.caption;
  img.src = ex.src;
  img.onerror = () => { frame.classList.add('missing'); img.remove(); };
  frame.appendChild(img);

  const p = document.createElement('p');
  p.className = 'caption';
  p.textContent = ex.caption;

  card.append(label, frame, p);
  el.appendChild(card);
  stage.appendChild(el);
  slides.push(el);
});

// closing piece: a sealed envelope that opens to a letter
const end = document.createElement('section');
end.className = 'slide closing-slide';
end.innerHTML = `
  <div class="env">
    <div class="env-back"></div>
    <div class="letter">
      <h3></h3>
      <div class="letter-body"></div>
      <div class="letter-sign"></div>
    </div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
  </div>`;
end.querySelector('h3').textContent = CONFIG.closingBig;
end.querySelector('.letter-body').textContent = CONFIG.letterBody;
end.querySelector('.letter-sign').textContent = CONFIG.closingSmall;
const env = end.querySelector('.env');
/* warp effect, then the letter opens full screen */
const fx = document.createElement('div');
fx.className = 'warp-fx';
document.body.appendChild(fx);

const full = document.createElement('div');
full.className = 'letter-full';
full.innerHTML = `
  <button class="lf-close" aria-label="ปิดจดหมาย"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
  <div class="lf-inner">
    <div class="lf-deco" aria-hidden="true">♡ 💐 ♡</div>
    <h3></h3>
    <div class="lf-body"></div>
    <div class="lf-sign"></div>
  </div>`;
full.querySelector('h3').textContent = CONFIG.closingBig;
full.querySelector('.lf-body').textContent = CONFIG.letterBody;
full.querySelector('.lf-sign').textContent = CONFIG.closingSmall;
document.body.appendChild(full);

let warping = false;
env.addEventListener('click', () => {
  if (warping) return;
  warping = true;
  env.classList.add('warp');
  fx.classList.remove('run');
  void fx.offsetWidth;          // restart the animation
  fx.classList.add('run');
  setTimeout(() => { full.scrollTop = 0; full.classList.add('show'); }, 900);
});

full.querySelector('.lf-close').addEventListener('click', () => {
  full.classList.remove('show');
  fx.classList.remove('run');
  env.classList.remove('warp');
  warping = false;
});
stage.appendChild(end);
slides.push(end);

/* ---------- Navigation ---------- */
let cur = 0;
const nextBtn = $('#nextBtn');
const nextIcon = $('#nextIcon');
const RESET_ICON = '<path d="M4 12a8 8 0 1 0 2.4-5.7"/><polyline points="4 4 4 9 9 9"/>';
const NEXT_ICON = '<polyline points="9 5 16 12 9 19"/>';

function place() {
  const last = slides.length - 1;
  if (cur !== last) env.classList.remove('open');   // envelope closes again when you leave it
  slides.forEach((el, i) => {
    const o = i - cur;                 // offset from the current piece
    let tx, ry, sc, z, op;
    if (o === 0) {                     // front, centered
      tx = '-50%'; ry = 0; sc = 1; z = 0; op = 1;
    } else if (o > 0) {                // waiting piles on the right
      const d = Math.min(o - 1, 3);
      tx = `calc(-50% + var(--pile) + ${d * 16}px)`;
      ry = -26; sc = 0.82 - d * 0.03; z = -d * 40; op = o - 1 > 3 ? 0 : 1 - d * 0.12;
    } else {                           // viewed piles on the left
      const d = Math.min(-o - 1, 3);
      tx = `calc(-50% - var(--pile) - ${d * 16}px)`;
      ry = 26; sc = 0.82 - d * 0.03; z = -d * 40; op = -o - 1 > 3 ? 0 : 1 - d * 0.12;
    }
    el.style.transform = `translate3d(${tx}, -50%, ${z}px) rotateY(${ry}deg) scale(${sc})`;
    el.style.opacity = op;
    el.style.visibility = op === 0 ? 'hidden' : 'visible';
    el.style.zIndex = 100 - Math.abs(o);
  });

  $('#bar').style.setProperty('--p', `${(cur / last) * 100}%`);
  const atEnd = cur === last;
  nextIcon.innerHTML = atEnd ? RESET_ICON : NEXT_ICON;
  nextBtn.setAttribute('aria-label', atEnd ? 'เริ่มใหม่' : 'ถัดไป');
}

function go(i) {
  cur = Math.max(0, Math.min(slides.length - 1, i));
  place();
}

nextBtn.addEventListener('click', () => {
  go(cur === slides.length - 1 ? 0 : cur + 1);
});

// keyboard
document.addEventListener('keydown', e => {
  if (!$('#hall').classList.contains('open')) return;
  if (e.key === 'ArrowRight') go(cur + 1);
  if (e.key === 'ArrowLeft') go(cur - 1);
});

// swipe (iPad / phone)
let sx = null;
stage.addEventListener('pointerdown', e => { sx = e.clientX; });
stage.addEventListener('pointerup', e => {
  if (sx === null) return;
  const dx = e.clientX - sx;
  sx = null;
  if (Math.abs(dx) > 50) go(dx < 0 ? cur + 1 : cur - 1);
});

/* ---------- Passcode: keypad, PIN dots, ticket effects ---------- */
const gate = $('#gate');
const codeInput = $('#code');
const ticket = $('#ticket');
const ticketWrap = $('#ticketWrap');
const hint = $('#hint');
let busy = false;

// PIN slots, one per digit of the passcode
const slotEls = [];
for (let i = 0; i < CONFIG.passcode.length; i++) {
  const s = document.createElement('span');
  s.className = 'slot';
  $('#slots').appendChild(s);
  slotEls.push(s);
}

function renderDots() {
  const n = codeInput.value.length;
  slotEls.forEach((s, i) => s.classList.toggle('on', i < n));
}

function pressKey(k) {
  if (busy) return;
  if (k === 'C') { codeInput.value = ''; hint.textContent = ''; renderDots(); return; }
  if (k === 'DEL') { codeInput.value = codeInput.value.slice(0, -1); renderDots(); return; }
  if (codeInput.value.length >= CONFIG.passcode.length) return;
  codeInput.value += k;
  hint.textContent = '';
  renderDots();
  if (codeInput.value.length === CONFIG.passcode.length) setTimeout(tryEnter, 220);
}

function tryEnter() {
  if (busy) return;
  const val = codeInput.value.trim();
  if (val === CONFIG.passcode) {
    // correct: stamp the ticket, then cinematic exit into the hall
    busy = true;
    ticket.classList.add('admitted');
    setTimeout(() => {
      gate.classList.add('leaving');
      setTimeout(() => {
        gate.style.display = 'none';
        $('#hall').classList.add('open');
        place();
      }, 900);
    }, 950);
  } else {
    // wrong: shake the ticket, show the message, then clear the PIN
    busy = true;
    hint.textContent = CONFIG.hint;
    ticketWrap.classList.remove('shake');
    void ticketWrap.offsetWidth;
    ticketWrap.classList.add('shake');
    setTimeout(() => {
      codeInput.value = '';
      renderDots();
      busy = false;
    }, 700);
  }
}

// back to the login ticket, with the PIN cleared
function backToGate() {
  if (full.classList.contains('show')) return;
  $('#hall').classList.remove('open');
  gate.classList.remove('leaving');
  gate.style.display = '';
  ticket.classList.remove('admitted');
  codeInput.value = '';
  hint.textContent = '';
  renderDots();
  busy = false;
}
$('#backBtn').addEventListener('click', backToGate);

// keypad: 1-9, C, 0, delete
const KEYS = ['1','2','3','4','5','6','7','8','9','C','0','DEL'];
const pad = $('#keypad');
KEYS.forEach(k => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'key' + (k === 'C' || k === 'DEL' ? ' fn' : '');
  if (k === 'DEL') {
    b.setAttribute('aria-label', 'ลบ');
    b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 6h11v12H9l-5-6z"/><line x1="12" y1="10" x2="17" y2="14"/><line x1="17" y1="10" x2="12" y2="14"/></svg>';
  } else if (k === 'C') {
    b.setAttribute('aria-label', 'ล้างรหัส');
    b.textContent = 'C';
  } else {
    b.textContent = k;
  }
  b.addEventListener('click', () => pressKey(k));
  pad.appendChild(b);
});

// physical keyboard
document.addEventListener('keydown', e => {
  if (gate.style.display === 'none' || full.classList.contains('show')) return;
  if (/^[0-9]$/.test(e.key)) pressKey(e.key);
  else if (e.key === 'Backspace') pressKey('DEL');
  else if (e.key === 'Escape') pressKey('C');
  else if (e.key === 'Enter') tryEnter();
});

// floating hearts and sparkles (kept light)
const fxLayer = $('#fxLayer');
for (let i = 0; i < 12; i++) {
  const h = document.createElement('span');
  h.className = 'heart';
  h.textContent = '♥';
  h.style.left = `${Math.random() * 100}%`;
  h.style.fontSize = `${10 + Math.random() * 12}px`;
  h.style.animationDuration = `${11 + Math.random() * 9}s`;
  h.style.animationDelay = `${-Math.random() * 20}s`;
  fxLayer.appendChild(h);
}
for (let i = 0; i < 14; i++) {
  const s = document.createElement('span');
  s.className = 'spark';
  s.style.left = `${Math.random() * 100}%`;
  s.style.top = `${Math.random() * 100}%`;
  s.style.width = s.style.height = `${4 + Math.random() * 6}px`;
  s.style.animationDuration = `${2.5 + Math.random() * 2.5}s`;
  s.style.animationDelay = `${-Math.random() * 5}s`;
  fxLayer.appendChild(s);
}

place();
</script>
</body>
</html>
